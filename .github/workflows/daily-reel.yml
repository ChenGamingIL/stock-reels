name: Daily stock reel

on:
  schedule:
    # GitHub cron is UTC only. 08:00 Israel is 05:00 UTC in summer and 06:00 UTC in winter,
    # so both fire and the "Israel 8am" step below lets only the right one through.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Force a ticker (optional)"
        required: false
      dry_run:
        description: "Build only, don't upload"
        type: boolean
        default: false
      check_instagram:
        description: "Only verify the Instagram connection"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Israel 8am
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Jerusalem date +%H)" != "08" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install system packages
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0
      - name: Download Hebrew font (Heebo)
        if: steps.gate.outputs.run == 'true'
        run: curl -fsSL -o assets/fonts/Heebo-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/heebo/Heebo%5Bwght%5D.ttf"
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Build and publish
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          TTS_REQUIRED: "1"
        run: |
          ARGS=""
          [ -n "${{ inputs.ticker }}" ] && ARGS="$ARGS --ticker ${{ inputs.ticker }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.check_instagram }}" = "true" ] && ARGS="--check-instagram"
          python run.py $ARGS
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: reel
          path: output/
          retention-days: 14
      - name: Remember today's ticker
        if: ${{ steps.gate.outputs.run == 'true' && inputs.dry_run != true && inputs.check_instagram != true }}
        run: |
          git config user.name "stock-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json && git commit -m "history: $(date +%F)" && git push || echo "nothing to commit"
