name: Daily stock reel

on:
  schedule:
    # GitHub cron is UTC only and Israel shifts between UTC+3 and UTC+2, so each slot has
    # two crons and the "Israel time" step lets only the right one through:
    # 08:00 hot stock, 15:30 pre-market review (Mon-Fri), 20:00 basics lesson.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      show:
        description: "Which show"
        type: choice
        options: [hot, premarket, lesson]
        default: hot
      ticker:
        description: "Force a ticker (optional)"
        required: false
      dry_run:
        description: "Build only, don't upload"
        type: boolean
        default: false
      story_only:
        description: "Post only the Story slides (no Reel)"
        type: boolean
        default: false
      highlights:
        description: "Post Highlight Story sets ('all' or e.g. bonds,basics)"
        required: false
      fetch_logo:
        description: "Save the Instagram profile picture to assets/logo.jpg"
        type: boolean
        default: false
      check_instagram:
        description: "Only verify the Instagram connection"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Israel time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "show=${{ inputs.show || 'hot' }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$(TZ=Asia/Jerusalem date +%H)" in
            08) show=hot ;;
            15) show=premarket ;;
            20) show=lesson ;;
            *) show="" ;;
          esac
          echo "show=$show" >> "$GITHUB_OUTPUT"
          [ -n "$show" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install system packages
        if: steps.gate.outputs.run == 'true'
        # retry once: an apt mirror occasionally hangs
        run: |
          for i in 1 2; do
            timeout 240 sh -c 'sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0' && exit 0
          done
          exit 1
      - name: Download Hebrew font (Heebo)
        if: steps.gate.outputs.run == 'true'
        run: curl -fsSL -o assets/fonts/Heebo-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/heebo/Heebo%5Bwght%5D.ttf"
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Build and publish
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          STORY_MODE: ${{ vars.STORY_MODE }}
          TTS_REQUIRED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--show ${{ steps.gate.outputs.show }}"
          [ -n "${{ inputs.ticker }}" ] && ARGS="$ARGS --ticker ${{ inputs.ticker }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.story_only }}" = "true" ] && ARGS="$ARGS --story-only"
          if [ -n "${{ inputs.highlights }}" ]; then
            ARGS="--highlights ${{ inputs.highlights }}"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          fi
          [ "${{ inputs.check_instagram }}" = "true" ] && ARGS="--check-instagram"
          [ "${{ inputs.fetch_logo }}" = "true" ] && ARGS="--fetch-logo"
          python run.py $ARGS
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: reel
          path: output/
          retention-days: 14
      - name: Remember today's ticker
        if: ${{ steps.gate.outputs.run == 'true' && steps.gate.outputs.show == 'hot' && !inputs.highlights && inputs.dry_run != true && inputs.check_instagram != true && inputs.fetch_logo != true && inputs.story_only != true }}
        run: |
          git config user.name "stock-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json && git commit -m "history: $(date +%F)" && git push || echo "nothing to commit"
      - name: Save logo
        if: ${{ inputs.fetch_logo == true }}
        run: |
          git config user.name "stock-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f assets/logo.jpg && git commit -m "Add logo from Instagram profile" && git push
