name: Daily stock reel
run-name: "${{ inputs.show }} ${{ inputs.dry_run && '(dry run)' || '' }}"

# Posting days only: the whole lineup goes out once every 3 days (stockreels/cadence.py).
# Started by clock.yml at each slot (GitHub's own cron was too unreliable):
# 08:00 hot stock, 12:30 "did you know", 18:00 question of the day, 20:00 lesson (Israel time); pre-market 08:30, open 09:45 and
# close 16:15 New York time, Mon-Fri. The Shabbat Shalom Story is shabbat.yml.
# Nothing posts between candle lighting and havdalah (stockreels/shabbat.py).
on:
  workflow_dispatch:
    inputs:
      show:
        description: "Which show"
        type: choice
        options: [hot, didyouknow, question, premarket, open, lesson, close, shabbat]
        default: hot
      ticker:
        description: "Force a ticker (optional)"
        required: false
      dry_run:
        description: "Build only, don't upload"
        type: boolean
        default: false
      preview:
        description: "With dry run: attach the video and Story clips to a release to watch"
        type: boolean
        default: false
      story_only:
        description: "Post only the Story slides (no Reel)"
        type: boolean
        default: false
      highlights:
        description: "Post Highlight Story sets ('all' or e.g. bonds,basics)"
        required: false
      fetch_logo:
        description: "Save the Instagram profile picture to assets/logo.jpg"
        type: boolean
        default: false
      check_instagram:
        description: "Only verify the Instagram connection"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Israel time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "show=${{ inputs.show || 'hot' }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # GitHub often starts scheduled runs hours late, so go by which cron fired, not the clock
          show=$(SCHEDULE="${{ github.event.schedule }}" python3 - <<'PY'
          import datetime as dt, os, sys
          from zoneinfo import ZoneInfo
          m, h = (int(x) for x in os.environ["SCHEDULE"].split()[:2])
          utc = dt.datetime.now(dt.timezone.utc)
          # (clock, slot, show, hours it may still go out late). Market shows follow New York time,
          # so the pre-market review stays an hour before the bell when only one country changed clocks.
          slots = [("Asia/Jerusalem", (8, 0), "hot", 6), ("Asia/Jerusalem", (12, 30), "didyouknow", 4),
                   ("Asia/Jerusalem", (20, 0), "lesson", 3),
                   ("America/New_York", (8, 30), "premarket", 0.9), ("America/New_York", (9, 45), "open", 2),
                   ("America/New_York", (16, 15), "close", 3)]
          show = ""
          for tz, slot, name, grace in slots:
              now = utc.astimezone(ZoneInfo(tz))
              off = int(now.utcoffset().total_seconds() // 3600)
              if ((h + off) % 24, m) != slot:
                  continue  # the other cron of this slot's pair, for the other DST state
              due = now.replace(hour=slot[0], minute=slot[1], second=0, microsecond=0)
              if due > now + dt.timedelta(hours=1):
                  due -= dt.timedelta(days=1)  # picked up after midnight
              late = (now - due).total_seconds() / 3600
              if late > grace:
                  print(f"::warning::{name} started {late:.1f}h late, skipping", file=sys.stderr)
              else:
                  show = name
          print(show)
          PY
          )
          echo "Israel $(TZ=Asia/Jerusalem date +%H:%M), cron '${{ github.event.schedule }}' -> '${show}'"
          echo "show=$show" >> "$GITHUB_OUTPUT"
          [ -n "$show" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install system packages
        if: steps.gate.outputs.run == 'true'
        # retry once: an apt mirror occasionally hangs
        run: |
          for i in 1 2; do
            timeout 240 sh -c 'sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0' && exit 0
          done
          exit 1
      - name: Download Hebrew font (Heebo)
        if: steps.gate.outputs.run == 'true'
        run: curl -fsSL -o assets/fonts/Heebo-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/heebo/Heebo%5Bwght%5D.ttf"
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Build and publish
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          STORY_MODE: ${{ vars.STORY_MODE }}
          TTS_REQUIRED: "1"
          PREVIEW: ${{ inputs.preview && '1' || '' }}
          FAL_KEY: ${{ secrets.FAL_KEY }}  # optional: sharper AI pictures from fal.ai; without it the free service is used
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--show ${{ steps.gate.outputs.show }}"
          [ -n "${{ inputs.ticker }}" ] && ARGS="$ARGS --ticker ${{ inputs.ticker }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.story_only }}" = "true" ] && ARGS="$ARGS --story-only"
          if [ -n "${{ inputs.highlights }}" ]; then
            ARGS="--highlights ${{ inputs.highlights }}"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          fi
          [ "${{ inputs.check_instagram }}" = "true" ] && ARGS="--check-instagram"
          [ "${{ inputs.fetch_logo }}" = "true" ] && ARGS="--fetch-logo"
          python run.py $ARGS
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: reel
          path: output/
          retention-days: 14
      - name: Remember the episode, today's ticker and today's pattern
        if: ${{ steps.gate.outputs.run == 'true' && contains(fromJSON('["hot","premarket","lesson","didyouknow","question","close"]'), steps.gate.outputs.show) && !inputs.highlights && inputs.dry_run != true && inputs.check_instagram != true && inputs.fetch_logo != true && inputs.story_only != true }}
        run: |
          git config user.name "stock-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          python -m stockreels.remember "${{ steps.gate.outputs.show }}: $(date +%F)"
      - name: Save logo
        if: ${{ inputs.fetch_logo == true }}
        run: |
          git config user.name "stock-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f assets/logo.jpg && git commit -m "Add logo from Instagram profile" && git push
