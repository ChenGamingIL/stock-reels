name: Instagram post stats

# Read-only: likes, views, reach, saves and shares for the given posts. The API can't delete posts
# (it answers "Unsupported delete request"), so duplicates are removed in the app. Run by hand only.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Post ids, comma separated"
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          IDS: ${{ inputs.ids }}
        run: |
          python - <<'PY'
          import json, os
          from stockreels import instagram
          for mid in [i.strip() for i in os.environ["IDS"].split(",") if i.strip()]:
              print("[stats]", mid, json.dumps(instagram.media_stats(mid), ensure_ascii=False))
          PY
