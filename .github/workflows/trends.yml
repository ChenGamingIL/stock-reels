name: X trends (Grok)

# רז, the team's X scout (stockreels/trends.py): what traders on X talk about this week. The content bot
# dispatches it before choosing a topic. It needs the XAI_API_KEY secret; without it the run says so and
# spends nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Ask Grok what X talks about
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m stockreels.trends --release
